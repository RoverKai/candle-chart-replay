# PR-Agent：自动生成 PR 描述 + 自动代码评审 + 评论里的 /describe /review /improve /ask
#
# 模型与 key 都写在下面的 env 里，不要挪进 .pr_agent.toml：
# 仓库配置是从「配置分支」读的，首个带 .pr_agent.toml 的 PR 上读不到它。
#
# 需要的仓库 Secret：DEEPSEEK_API_KEY
#   Settings > Secrets and variables > Actions > New repository secret

name: PR Agent

on:
  pull_request:
    # synchronize = 每次 push 都重新评审（更贵，但改动不会漏评）
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    name: PR-Agent
    # 跳过 bot 自己发的评论，避免 PR-Agent 回复自己造成死循环
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    # ai_timeout 是 35 分钟，job 要留出装 diff、发评论的余量
    timeout-minutes: 45
    permissions:
      contents: read         # 读取 PR 与文件
      issues: write          # 回复 issue_comment 里的斜杠命令
      pull-requests: write   # 评论、行内建议、标签
    # 同一 PR 的新 push 取消上一轮，省 token
    concurrency:
      group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: PR Agent action step
        id: pragent
        # 固定到 v0.50.0 的 commit SHA，不用 @main
        uses: the-pr-agent/pr-agent@e673a02076ce09a4726c3d0c3cc85780e59ca52b
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 必须用 provider 原生变量名：PR-Agent 启动时的 key 检查读的是这个
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          config.model: "deepseek/deepseek-flash"
          config.fallback_models: '[]'
          # 思考强度：none/minimal/low/medium/high/xhigh/max
          # DeepSeek 侧映射：medium→high、xhigh→high、max→max，
          # 所以默认 medium 实际已经是 high，只有 max 才是真的顶格。
          config.reasoning_effort: "max"
          # 上下文预算。max_model_tokens 是硬上限（默认 32000），会二次夹住
          # custom_model_max_tokens——只设后者不设前者，预算仍然是 32000。
          # 想放宽就两个一起改；调太大反而会拉低评审质量（输入过长模型会退化）。
          #
          # 524288 = 393216 输出预留 + 131072 输入。PR-Agent 装 diff 时会把
          # max_output_tokens 从上下文窗口里扣掉再算输入预算；如果这里只写 131072，
          # 393216 的输出预留会把输入预算挤成 0，diff 直接装不进去。
          # 模型本身是 1M 上下文 / 384K 输出，512K 的上下文预算仍在模型能力之内。
          config.max_model_tokens: "524288"
          config.custom_model_max_tokens: "524288"
          # 单次生成的硬上限。不设时由 DeepSeek 服务端决定：thinking 模式默认 64K。
          # 2026-11-26 的 /review 就是 64K 全花在 reasoning 上、正文为空
          # （finish_reason=length）。这里直接给到模型上限 384K，不再让服务端默认值截断。
          config.max_output_tokens: "393216"
          # 384K 输出按 flash 的速度约 32 分钟；平时评审 5 分钟左右，这里只是兜底。
          config.ai_timeout: "2100"
          # 超时重试会让 35 分钟的上限翻倍、必然撞 job timeout，关掉它
          config.retry_same_model_on_timeout: "false"
          config.response_language: "zh-CN"
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          # auto_improve 会连带跑一次 review，保持 false 避免一次 push 花双份钱
          github_action_config.auto_improve: "false"
          # 保持 false：true 会切到 push_commands，自动 describe/review 反而不跑
          github_action_config.handle_push_trigger: "false"
          # 这里的 synchronize 决定「每次 push 都评审」
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
