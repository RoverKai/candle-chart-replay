# PR-Agent 仓库配置：只管评审策略。
# 模型 / API key / token 预算 / 超时 / 输出语言都在 .github/workflows/pr_agent.yml 的 env 里，
# 因为本文件是从默认分支（main）读的，首个引入它的 PR 上还读不到。

[config]
# 给评审者一点领域背景；没有 AGENTS.md，用 README 的用法/接口说明
repo_context_files = ["README.md"]
repo_context_from_default_branch = true
repo_context_max_lines = 200

[ignore]
# 锁文件、构建产物、第三方源码、二进制与一次性脚本：diff 大且没有评审价值
glob = [
  "package-lock.json",
  "node_modules/**",
  "web/vendor/**",
  "**/__pycache__/**",
  "*.pyc",
  "*.hst",
  "shots/**",
  "data/**",
  "tools/**",
]

[pr_reviewer]
num_max_findings = 8
# 仓库没有单元测试框架，测试要求写在 extra_instructions 里，避免泛泛要「补测试」
require_tests_review = false
# 没接 issue 系统，关掉以避免编造工单分析
require_ticket_analysis_review = false
extra_instructions = """
本仓库的硬约束，评审时按此判断，不要按通用 Web 项目的习惯提要求：

- 运行环境：server/ 只能用 Python 3.9+ 标准库，不得引入第三方依赖；前端是原生 ES module + web/vendor 里内置的 lightweight-charts，没有打包步骤。看到新增运行时依赖、构建链、CDN 引用，按阻塞问题提出。
- .hst 解析（server/hst.py）：按小端序读 MT4 二进制记录，存在 44/60 字节两种记录长度与不同版本头。任何改动偏移、长度推断、时间戳换算（MT4 时间是本地时区的秒级时间）的地方，必须指出对旧数据文件和异常文件的兼容性风险。
- /api 契约：GET /api/catalog、/api/bars、/api/refresh 返回的 JSON 字段被 web/js 直接消费。改字段名/类型必须同时改前端，并说明是否需要清缓存（/api/refresh）。
- 安全：server/app.py 用 SimpleHTTPRequestHandler 托管 web/，server/symbol/period 来自查询参数并参与 find_hst 拼路径。任何未做白名单或路径规范化校验的拼接，按路径穿越风险提出。
- 报错文案面向本机用户，保持中文且可操作（指明目录、参数、端口），不要静默吞异常或改英文。
- 前端交互（回放、画线、下单面板）有改动时，请作者说明跑过哪个 tools/verify*.mjs 或附截图；不要凭空要求新建单元测试。
- 中文注释和文档保持现状，不要建议改成英文。
"""

[pr_description]
publish_labels = true
generate_ai_title = false
# 保留作者自己写的描述，生成的放在下面
add_original_user_description = true

[pr_code_suggestions]
committable_code_suggestions = true
