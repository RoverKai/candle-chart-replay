[package]
name = "kline-replay"
version = "1.0.0"
edition = "2021"
rust-version = "1.87"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
