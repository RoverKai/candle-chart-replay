<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K线复盘 · MT4</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23131722'/><rect x='7' y='3' width='2' height='10' fill='%2326a69a'/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-mark"></span>K线复盘</div>

  <div class="field">
    <span class="cap">账户</span>
    <select id="serverSelect" title="MT4 服务器 / 账户"></select>
  </div>

  <div class="field">
    <span class="cap">品种</span>
    <select id="symbolSelect" title="品种"></select>
  </div>

  <div class="field period-field">
    <span class="cap">周期</span>
    <div class="periods" id="periodBar" role="group" aria-label="K线周期"></div>
    <span class="pane-scope" id="periodScope" hidden></span>
  </div>

  <div class="layout-switch" id="layoutSwitch" title="窗格数量">
    <button data-layout="1" class="active">1</button>
    <button data-layout="2">2</button>
    <button data-layout="3">3</button>
    <button data-layout="4">4</button>
  </div>

  <div class="split-switch" id="splitSwitch" title="双窗格方向" hidden>
    <button data-split="col" class="active" title="上下分屏">上下</button>
    <button data-split="row" title="左右分屏">左右</button>
  </div>

  <div class="replay-badge" id="replayBadge"
       title="正在回放：当前之后的 K 线已隐藏" hidden>回放中</div>

  <div class="grow"></div>

  <button class="ghost icon" id="btnChartSettings" title="图表设置" aria-label="图表设置">
    <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true">
      <path d="M8 2.2l.45 1.32c.48.16.92.41 1.3.75l1.35-.35.9 1.56-1 1a4.8 4.8 0 0 1 0 1.5l1 1-.9 1.56-1.35-.35a4.7 4.7 0 0 1-1.3.75L8 13.8l-.45-1.32a4.7 4.7 0 0 1-1.3-.75l-1.35.35-.9-1.56 1-1a4.8 4.8 0 0 1 0-1.5l-1-1 .9-1.56 1.35.35a4.7 4.7 0 0 1 1.3-.75L8 2.2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
      <circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/>
    </svg>
  </button>
  <button class="ghost" id="btnIndicators">指标 <em>▾</em></button>
  <button class="ghost" id="btnDrawMenu">画线 <em>▾</em></button>
  <button class="ghost accent" id="btnTradePanel">交易 <em>▾</em></button>
</header>

<!-- 指标面板 -->
<div class="popover" id="indicatorPanel" hidden>
  <div class="pop-title">主图</div>
  <label class="chk"><input type="checkbox" id="ind-ma5">   MA 5</label>
  <label class="chk"><input type="checkbox" id="ind-ma10">  MA 10</label>
  <label class="chk"><input type="checkbox" id="ind-ma20" checked> MA 20</label>
  <label class="chk"><input type="checkbox" id="ind-ma60">  MA 60</label>
  <label class="chk"><input type="checkbox" id="ind-ema20"> EMA 20</label>
  <label class="chk"><input type="checkbox" id="ind-boll">  布林带 20,2</label>
  <label class="chk"><input type="checkbox" id="ind-vol" checked> 成交量</label>
  <div class="pop-title">副图</div>
  <label class="chk"><input type="radio" name="sub" value="none" checked> 无</label>
  <label class="chk"><input type="radio" name="sub" value="macd"> MACD 12,26,9</label>
  <label class="chk"><input type="radio" name="sub" value="rsi">  RSI 14</label>
</div>

<!-- 画线面板 -->
<div class="popover" id="drawPanel" hidden>
  <button class="menu-item" id="btnUndo">撤销 <kbd>Ctrl+Z</kbd></button>
  <button class="menu-item" id="btnDeleteSel">删除选中 <kbd>Del</kbd></button>
  <button class="menu-item" id="btnStyleSel">画线样式… <kbd>双击画线</kbd></button>
  <button class="menu-item" id="btnClearAll">清空本窗格画线</button>
  <button class="menu-item" id="btnExportDraw">导出画线 JSON</button>
  <button class="menu-item" id="btnImportDraw">导入画线 JSON</button>
  <input type="file" id="importFile" accept="application/json" hidden>
  <div class="pop-title">悬浮工具栏</div>
  <button class="menu-item" id="btnFloatSettingsMenu">选择显示的工具…</button>
  <button class="menu-item" id="btnFloatToggle">隐藏悬浮工具栏</button>
</div>

<!-- 画线样式面板 -->
<div class="popover style-panel" id="stylePanel" hidden>
  <div class="style-head">
    <span id="styleTitle">画线样式</span>
    <button class="style-x" id="btnStyleClose" title="关闭">×</button>
  </div>
  <div class="style-body" id="styleBody"></div>
</div>

<main class="workspace">
  <aside class="toolbar" id="toolbar"></aside>
  <div class="chart-grid" id="chartGrid" data-layout="1">
    <div class="pane-resizer" id="paneResizer" role="separator" tabindex="0"
         aria-orientation="horizontal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"
         aria-label="上下窗格分隔线" title="拖动调整窗格大小，双击恢复 50/50" hidden></div>

    <!-- 悬浮绘图工具栏: 覆盖在图表上, 可拖动, 只显示设置里勾选的工具 -->
    <div class="float-tools" id="floatTools" role="toolbar" aria-label="悬浮绘图工具栏" hidden>
      <div class="ft-grip" id="floatToolsGrip" title="按住拖动悬浮工具栏" aria-hidden="true">
        <svg viewBox="0 0 10 10" fill="currentColor">
          <circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/>
          <circle cx="3" cy="5" r="1.2"/><circle cx="7" cy="5" r="1.2"/>
          <circle cx="3" cy="8" r="1.2"/><circle cx="7" cy="8" r="1.2"/>
        </svg>
      </div>
      <div class="ft-list" id="floatToolList"></div>
      <div class="ft-sep"></div>
      <div class="ft-foot">
        <button class="ft-act" id="btnFloatSettings" type="button"
                title="选择显示的工具" aria-label="选择显示的工具">
          <svg viewBox="0 0 16 16" width="13" height="13" fill="none" aria-hidden="true">
            <path d="M8 2.2l.45 1.32c.48.16.92.41 1.3.75l1.35-.35.9 1.56-1 1a4.8 4.8 0 0 1 0 1.5l1 1-.9 1.56-1.35-.35a4.7 4.7 0 0 1-1.3.75L8 13.8l-.45-1.32a4.7 4.7 0 0 1-1.3-.75l-1.35.35-.9-1.56 1-1a4.8 4.8 0 0 1 0-1.5l-1-1 .9-1.56 1.35.35a4.7 4.7 0 0 1 1.3-.75L8 2.2Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <circle cx="8" cy="8" r="1.8" stroke="currentColor" stroke-width="1.2"/>
          </svg>
        </button>
        <button class="ft-act" id="btnFloatClose" type="button"
                title="隐藏悬浮工具栏" aria-label="隐藏悬浮工具栏">×</button>
      </div>
    </div>

    <!-- 悬浮工具栏设置 -->
    <div class="float-panel" id="floatToolSettings" hidden role="dialog" aria-label="悬浮工具栏设置">
      <div class="ftp-head">
        <span>悬浮工具栏设置</span>
        <button class="ftp-x" id="btnFloatSettingsClose" type="button" title="关闭" aria-label="关闭">×</button>
      </div>
      <div class="ftp-sub">勾选要显示的工具，修改立即生效</div>
      <div class="ftp-list" id="floatToolOptions"></div>
      <div class="ftp-foot">
        <button class="ftp-link" id="btnFloatAll" type="button">全选</button>
        <button class="ftp-link" id="btnFloatNone" type="button">清空</button>
        <button class="ftp-done" id="btnFloatDone" type="button">完成</button>
      </div>
    </div>
  </div>

  <aside class="trade-panel" id="tradePanel" hidden>
    <div class="tp-head">
      <span>模拟交易</span>
      <button class="tp-x" id="btnTradeClose" title="收起">×</button>
    </div>

    <div class="tp-body">
      <div class="tp-block">
        <div class="tp-label">开仓 <em id="tpEntryPrice"></em></div>
        <label class="tp-reason">
          <span>入场理由 <em>必填</em></span>
          <textarea id="entryReason" rows="2" maxlength="500" placeholder="例：M5 回踩趋势线不破，结构仍多"></textarea>
        </label>
        <div class="tp-buttons">
          <button class="trade-btn buy" id="btnBuy" title="市价开多，可多次点击加仓或对冲">买入<small>做多</small></button>
          <button class="trade-btn sell" id="btnSell" title="市价开空，可多次点击加仓或对冲">卖出<small>做空</small></button>
        </div>
        <div class="tp-grid">
          <label>手数<input id="lotsInput" type="number" min="0.01" step="0.01" value="0.1"></label>
          <label>合约<input id="contractInput" type="number" min="1" step="1" value="100"></label>
          <label>止损<input id="slInput" type="number" step="0.01" placeholder="可选"></label>
          <label>止盈<input id="tpTargetInput" type="number" step="0.01" placeholder="可选"></label>
          <label class="wide">止损理由<input id="slReasonInput" type="text" maxlength="500" placeholder="设置止损时必填"></label>
          <label class="wide">止盈理由<input id="tpReasonInput" type="text" maxlength="500" placeholder="设置止盈时必填"></label>
        </div>
        <label class="chk oco-row" title="勾选后：任意一张挂单成交会自动撤销其余挂单">
          <input type="checkbox" id="ocoInput"> 挂单 OCO
        </label>
      </div>

      <div class="tp-block" id="posBlock"></div>
      <div class="tp-block" id="ordersBlock"></div>
      <div class="tp-block" id="statsBlock"></div>

      <div class="tp-block">
        <div class="tp-label">成交记录 <span class="muted" id="tradeCount"></span></div>
        <div class="tp-list" id="tradeList"></div>
      </div>
    </div>

    <div class="tp-foot">
      <button class="ghost sm on" id="btnToggleHistory" aria-pressed="true"
              title="点击隐藏图表上的历史仓位">历史仓位</button>
      <button class="ghost sm" id="btnExportTrades">导出 CSV</button>
      <button class="ghost sm" id="btnClearTrades">清空记录</button>
    </div>
  </aside>
</main>

<footer class="replaybar">
  <button class="ico" id="btnRewind" title="回到回放起点">⏮</button>
  <button class="ico" id="btnPrev" title="上一根 (←)">◀</button>
  <button class="ico play" id="btnPlay" title="播放 / 暂停 (空格)">▶</button>
  <button class="ico" id="btnNext" title="下一根 (→)">▶|</button>
  <button class="ico" id="btnEnd" title="跳到最新一根">⏭</button>

  <input type="range" id="cursorSlider" min="0" max="100" value="100" step="1">

  <div class="status">
    <span id="barPos">— / —</span>
    <span class="dot-sep">·</span>
    <span id="barTime">—</span>
  </div>

  <label class="speed">速度
    <select id="speedSelect">
      <option value="1">1×</option>
      <option value="2">2×</option>
      <option value="4" selected>4×</option>
      <option value="8">8×</option>
      <option value="16">16×</option>
    </select>
  </label>

  <input type="date" id="jumpDate" title="跳转到日期">
  <button class="ghost sm" id="btnJump">跳转</button>
  <button class="ghost sm" id="btnShowAll">显示全部</button>
</footer>

<div class="ctx-menu" id="ctxMenu" hidden></div>

<!-- 止损 / 止盈设置：从图上拖动后弹出，也可以点持仓行打开 -->
<div class="level-pop" id="levelPop" hidden role="dialog" aria-label="止损止盈设置">
  <header class="lp-head">
    <span class="lp-title">止损 / 止盈设置</span>
    <span class="lp-pos" id="lpPos"></span>
    <button class="lp-x" id="lpClose" type="button" title="关闭" aria-label="关闭">×</button>
  </header>
  <div class="lp-body">
    <div class="lp-row" id="lpSlRow">
      <div class="lp-line">
        <span class="lp-kind sl">止损 <em>SL</em></span>
        <label class="lp-field"><span>价格</span><input id="lpSlPrice" type="number" step="0.01" placeholder="未设置"></label>
        <label class="lp-field"><span>手数</span><input id="lpSlLots" type="number" min="0.01" step="0.01" placeholder="全部"></label>
        <button class="lp-clear" id="lpSlClear" type="button" title="取消止损">清除</button>
      </div>
      <label class="lp-reason">
        <span>止损理由</span>
        <input id="lpSlReason" type="text" maxlength="500" placeholder="设置止损时必填">
      </label>
    </div>
    <div class="lp-row" id="lpTpRow">
      <div class="lp-line">
        <span class="lp-kind tp">止盈 <em>TP</em></span>
        <label class="lp-field"><span>价格</span><input id="lpTpPrice" type="number" step="0.01" placeholder="未设置"></label>
        <label class="lp-field"><span>手数</span><input id="lpTpLots" type="number" min="0.01" step="0.01" placeholder="全部"></label>
        <button class="lp-clear" id="lpTpClear" type="button" title="取消止盈">清除</button>
      </div>
      <label class="lp-reason">
        <span>止盈理由</span>
        <input id="lpTpReason" type="text" maxlength="500" placeholder="设置止盈时必填">
      </label>
    </div>
  </div>
  <div class="lp-tip" id="lpHint"></div>
  <footer class="lp-foot">
    <button class="lp-btn" id="lpApply" type="button">应用</button>
  </footer>
</div>

<!-- 平仓理由：面板平仓 / E / 行内 × / 右键 / 全部平仓都先经过这里 -->
<div class="cs-backdrop reason-backdrop" id="reasonDialog" hidden>
  <div class="cs-dialog reason-dialog" role="dialog" aria-modal="true" aria-labelledby="reasonTitle">
    <header class="cs-head">
      <h2 id="reasonTitle">平仓理由</h2>
      <button class="cs-x" id="reasonClose" type="button" title="关闭" aria-label="关闭">×</button>
    </header>
    <div class="reason-body">
      <div class="reason-sub" id="reasonSub"></div>
      <div class="reason-context" id="reasonContext"></div>
      <label class="reason-field">
        <span>平仓理由 <em>必填</em></span>
        <textarea id="reasonText" rows="4" maxlength="500" placeholder="例：跌破关键支撑，原有结构失效"></textarea>
      </label>
      <div class="reason-error" id="reasonError"></div>
      <div class="reason-tip">Ctrl / ⌘ + Enter 确认，Esc 取消</div>
    </div>
    <footer class="cs-foot">
      <span class="grow"></span>
      <button class="cs-btn" id="reasonCancel" type="button">取消</button>
      <button class="cs-btn primary" id="reasonConfirm" type="button">确认平仓</button>
    </footer>
  </div>
</div>

<!-- 图表设置 -->
<div class="cs-backdrop" id="chartSettings" hidden>
  <div class="cs-dialog" id="csDialog" role="dialog" aria-modal="true" aria-labelledby="csTitle" tabindex="-1">
    <header class="cs-head">
      <h2 id="csTitle">图表设置</h2>
      <label class="cs-preset-wrap">预设
        <select id="csPreset" aria-label="样式预设"></select>
      </label>
      <button class="cs-x" id="csClose" type="button" title="关闭" aria-label="关闭">×</button>
    </header>

    <div class="cs-main">
      <nav class="cs-nav" id="csNav" role="tablist" aria-label="设置分类"></nav>
      <div class="cs-content">
        <div class="cs-preview-wrap">
          <canvas id="csPreview" aria-label="样式预览"></canvas>
        </div>
        <div class="cs-body" id="csBody" role="tabpanel"></div>
      </div>
    </div>

    <footer class="cs-foot">
      <button class="cs-btn" id="csReset" type="button">恢复默认</button>
      <span class="grow"></span>
      <button class="cs-btn" id="csCancel" type="button">取消</button>
      <button class="cs-btn primary" id="csApply" type="button">应用</button>
    </footer>
  </div>
</div>

<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script src="js/indicators.js"></script>
<script src="js/drawings.js"></script>
<script src="js/trading.js"></script>
<script src="js/chart-style.js"></script>
<script src="js/app.js"></script>
<script src="js/float-tools.js"></script>
</body>
</html>
